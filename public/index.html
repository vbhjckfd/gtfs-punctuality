<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lviv departure punctuality</title>
<meta name="description" content="How late or early Lviv buses really leave the terminus, compared with the GTFS timetable.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="top">
    <h1 data-i18n="h1">Lviv terminus departures: actual vs timetable</h1>
    <div class="langs" role="group" aria-label="Language / Мова">
      <button type="button" data-lang="en" aria-pressed="true" title="English" aria-label="English"><svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><clipPath id="gb-t"><path d="M30,15h30v15zv15h-30zh-30v-15zv-15h30z"/></clipPath><path d="M0,0v30h60v-30z" fill="#012169"/><path d="M0,0L60,30M60,0L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0L60,30M60,0L0,30" clip-path="url(#gb-t)" stroke="#C8102E" stroke-width="4"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg></button>
      <button type="button" data-lang="uk" aria-pressed="false" title="Українська" aria-label="Українська"><svg viewBox="0 0 3 2" preserveAspectRatio="none" aria-hidden="true"><rect width="3" height="1" fill="#0057B7"/><rect y="1" width="3" height="1" fill="#FFD700"/></svg></button>
    </div>
  </div>
  <p class="sub" data-i18n="sub">Measured from archived GTFS-RT vehicle positions against the planned first-stop time in GTFS static.</p>
  <div class="controls">
    <label><span data-i18n="window">Window</span>
      <select id="days"><option value="1" data-i18n="today">today</option><option value="7" selected data-i18n="days" data-arg="7">7 days</option><option value="30" data-i18n="days" data-arg="30">30 days</option><option value="90" data-i18n="days" data-arg="90">90 days</option></select>
    </label>
    <span id="filter" hidden><button id="clear" type="button"><span data-i18n="route">route</span> <b id="filter-name"></b> ✕</button></span>
    <span id="status" class="muted"></span>
  </div>
</header>
<main>
  <section id="kpis" class="kpis"></section>
  <section class="card"><h2 data-i18n="histTitle">Departure error distribution</h2><div id="hist"></div><p class="muted" id="hist-note"></p></section>
  <div class="grid">
    <section class="card"><h2 data-i18n="byHour">By hour of day</h2><div id="hours"></div></section>
    <section class="card"><h2 data-i18n="byDay">By day</h2><div id="days-chart"></div></section>
  </div>
  <section class="card" id="modes-card"><h2 data-i18n="byMode">By mode</h2><div class="scroll"><table id="modes"></table></div></section>
  <section class="card" id="routes-card"><h2 data-i18n="routes">Routes</h2><div class="scroll"><table id="routes"></table></div></section>
  <section class="card"><h2 data-i18n="recentTitle">Latest measured departures</h2><div class="scroll"><table id="recent"></table></div></section>
</main>
<footer>
  <p data-i18n-html="methodology"></p>
  <p data-i18n-html="dataLine"></p>
</footer>
<script src="app.js" type="module"></script>
</body>
</html>
