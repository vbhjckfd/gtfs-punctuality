name: Import GTFS static
on:
  schedule:
    - cron: "40 2 * * *"   # daily; the importer exits early when the archive is unchanged
  workflow_dispatch:
    inputs:
      force:
        description: "Import even if unchanged"
        type: boolean
        default: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/import-static.mjs ${{ inputs.force && '--force' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # needs D1:Edit
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
